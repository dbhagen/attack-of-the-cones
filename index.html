<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Attack of Cones - A voxel-style vertical scroller game" />
    <title>Attack of Cones</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        width: 100%;
        height: 100vh;
        overflow: hidden;
        font-family:
          -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell,
          sans-serif;
        background: #1a1a1a;
        color: #fff;
        display: flex;
        justify-content: center;
        align-items: center;
      }

      #app {
        width: 100%;
        max-width: 428px;
        height: 100%;
        position: relative;
        margin: 0 auto;
      }

      canvas {
        display: block;
        width: 100%;
        height: 100%;
      }

      #debug-overlay {
        position: absolute;
        top: 10px;
        left: 10px;
        background: rgba(0, 0, 0, 0.7);
        padding: 10px;
        border-radius: 4px;
        font-family: 'Courier New', monospace;
        font-size: 12px;
        pointer-events: none;
        z-index: 1000;
      }

      #debug-overlay.hidden {
        display: none;
      }

      #hud-overlay {
        position: absolute;
        top: 100px;
        right: 10px;
        background: rgba(0, 0, 0, 0.7);
        padding: 12px 16px;
        border-radius: 4px;
        font-family:
          -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell,
          sans-serif;
        font-size: 14px;
        pointer-events: none;
        z-index: 1000;
        min-width: 150px;
      }

      #hud-overlay.hidden {
        display: none;
      }

      #hud-overlay .hud-row {
        display: flex;
        justify-content: space-between;
        margin-bottom: 6px;
        gap: 16px;
      }

      #hud-overlay .hud-row:last-child {
        margin-bottom: 0;
      }

      #hud-overlay .hud-label {
        color: #aaa;
        font-weight: 500;
      }

      #hud-overlay .hud-value {
        color: #fff;
        font-weight: 600;
        text-align: right;
      }

      #hud-overlay .hud-score {
        margin-top: 8px;
        padding-top: 8px;
        border-top: 1px solid rgba(255, 255, 255, 0.2);
      }

      #loading {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        font-size: 24px;
        color: #fff;
      }

      #start-menu {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        background: rgba(0, 0, 0, 0.9);
        padding: 40px 60px;
        border-radius: 12px;
        z-index: 2000;
        text-align: center;
        min-width: 300px;
      }

      #start-menu.hidden {
        display: none;
      }

      #start-menu h2 {
        font-size: 36px;
        color: #ff6600;
        margin-bottom: 30px;
        font-weight: 800;
      }

      #start-menu .mode-buttons {
        display: flex;
        flex-direction: column;
        gap: 15px;
      }

      #start-menu button {
        background: #ff6600;
        color: #fff;
        border: none;
        border-radius: 6px;
        padding: 15px 30px;
        font-size: 18px;
        font-weight: 600;
        cursor: pointer;
        transition: background 0.2s;
      }

      #start-menu button:hover {
        background: #ff7700;
      }

      #start-menu button:active {
        background: #ee5500;
      }

      #back-button {
        position: absolute;
        top: 100px;
        left: 10px;
        background: rgba(0, 0, 0, 0.7);
        color: #fff;
        border: 1px solid rgba(255, 255, 255, 0.3);
        border-radius: 4px;
        padding: 8px 16px;
        font-size: 14px;
        font-weight: 600;
        cursor: pointer;
        z-index: 1000;
        transition: background 0.2s;
      }

      #back-button:hover {
        background: rgba(0, 0, 0, 0.85);
      }

      #back-button.hidden {
        display: none;
      }

      #near-miss-message {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        font-size: 36px;
        font-weight: bold;
        color: #ffff00;
        text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.8);
        pointer-events: none;
        opacity: 0;
        transition: opacity 0.2s;
        z-index: 999;
        text-align: center;
      }

      #near-miss-message.show {
        opacity: 1;
      }

      #near-miss-message .points {
        display: block;
        font-size: 24px;
        margin-top: 8px;
      }

      #cone-hit-message {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        font-size: 36px;
        font-weight: bold;
        color: #ff0000;
        text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.8);
        pointer-events: none;
        opacity: 0;
        transition: opacity 0.2s;
        z-index: 999;
        text-align: center;
      }

      #cone-hit-message.show {
        opacity: 1;
      }

      #cone-hit-message.daniel-mode {
        color: #00ff00;
      }

      #cone-hit-message.normal-mode {
        color: #ff0000;
      }

      #cone-hit-message .points {
        display: block;
        font-size: 24px;
        margin-top: 8px;
      }

      #game-title {
        position: absolute;
        top: 10px;
        left: 50%;
        transform: translateX(-50%);
        font-family:
          -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell,
          sans-serif;
        font-size: 32px;
        font-weight: 800;
        color: #ff6600;
        text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.8);
        z-index: 1000;
        pointer-events: none;
      }

      #game-title.hidden {
        display: none;
      }
    </style>
  </head>
  <body>
    <div id="app">
      <div id="loading">Loading Attack of Cones...</div>
      <div id="game-title" class="hidden">ATTACK OF CONES</div>

      <div id="start-menu">
        <h2>ATTACK OF CONES</h2>
        <div class="mode-buttons">
          <button id="start-normal">Play Normal Mode</button>
          <button id="start-daniel">Play Daniel Mode</button>
        </div>
      </div>

      <button id="back-button" class="hidden">← Back to Menu</button>

      <div id="near-miss-message">
        <div class="message-text">Near miss!</div>
        <div class="points">+5 points</div>
      </div>
      <div id="cone-hit-message">
        <div class="message-text">Cone hit!</div>
        <div class="points"></div>
      </div>
      <div id="debug-overlay" class="hidden">
        <div>FPS: <span id="fps">60</span></div>
        <div>Draw Calls: <span id="draw-calls">0</span></div>
        <div>Triangles: <span id="triangles">0</span></div>
      </div>
      <div id="hud-overlay" class="hidden">
        <div class="hud-row">
          <span class="hud-label">Speed:</span>
          <span class="hud-value"><span id="hud-speed">0.0</span></span>
        </div>
        <div class="hud-row">
          <span class="hud-label">Distance:</span>
          <span class="hud-value"><span id="hud-distance">0.0</span></span>
        </div>
        <div class="hud-row">
          <span class="hud-label">Time:</span>
          <span class="hud-value"><span id="hud-time">0.0</span>s</span>
        </div>
        <div class="hud-row">
          <span class="hud-label">Cones Hit:</span>
          <span class="hud-value"><span id="hud-cones-hit">0</span></span>
        </div>
        <div class="hud-row">
          <span class="hud-label">Cones Missed:</span>
          <span class="hud-value"><span id="hud-cones-missed">0</span></span>
        </div>
        <div class="hud-row hud-score">
          <span class="hud-label">Score:</span>
          <span class="hud-value"><span id="hud-score">0.00</span></span>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
